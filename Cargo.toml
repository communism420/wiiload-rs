[package]
name = "wiiload"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mq1/wiiload-rs"
homepage = "https://github.com/mq1/wiiload-rs"
description = "A minimal wiiload implementation in rust"

[features]
default = []
async = ["dep:futures"]
compression = ["dep:flate2", "dep:tempfile"]
compression-async = ["dep:async-compression"]
cli = ["dep:lexopt"]

[dependencies]
thiserror = "2"
futures = { version = "0.3", optional = true, default-features = false, features = [
  "async-await",
  "std",
] }
flate2 = { version = "1", optional = true }
async-compression = { version = "0.4", optional = true, features = [
  "zlib",
  "futures-io",
] }
tempfile = { version = "3", optional = true }
lexopt = { version = "0.3", optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
